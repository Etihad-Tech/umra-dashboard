# nginx in front of the web container, on a server where nginx already owns 80/443 for other apps.
# __SITE_DOMAIN__ and __WEB_PORT__ are filled in at install time (DEPLOY.md step 5); certbot --nginx then adds the
# "listen 443 ssl" lines and the HTTP->HTTPS redirect to the installed copy.
# Every security header and the CSP come from Caddy (deploy/Caddyfile) and pass through unchanged: add none here,
# a second copy of a header would make browsers combine or ignore them.
server {
    listen 80;
    server_name __SITE_DOMAIN__;
    server_tokens off;

    location / {
        proxy_pass         http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Let's Encrypt check (certbot renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
